# Litium Serverless Cloud deployment workflow (GitHub Actions)
#
# Starting point only. Replace every <placeholder>, adapt the project path, the target
# framework and any client build steps to your solution, and test the workflow in your
# own repository against a test environment before you point it at production.
#
# Save as .github/workflows/deploy.yml
#
# Prerequisites
#   - The web project references the Litium.Cloud.Tools.Targets package, so that
#     'dotnet publish' writes litiumcloud.manifest.json into the publish folder.
#   - A service principal with the minimum deployment roles: subscription/reader and
#     artifact/creator on the subscription, environment/reader on the environment and
#     appresource/writer on the app.
#   - Repository or environment secrets (Settings > Secrets and variables > Actions):
#       LITIUM_NUGET_USER        docs account user name for the Litium NuGet feed
#       LITIUM_NUGET_PASSWORD    its password
#       LITIUM_SP_ID             the service principal id, service.<name>@cloud
#       LITIUM_SP_CERTIFICATE    the full content of the .pem file, private key and
#                                certificate, pasted exactly as it is with its line breaks
#
# Every step is a bash script on a Linux runner. Each step does one thing, reads its
# input from environment variables, and fails the workflow on the first error.

name: Deploy to Litium Serverless Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  LITIUM_SUBSCRIPTION: <subscription-id>
  LITIUM_ENVIRONMENT: <environment-id>
  LITIUM_APP: <app-id>                     # for example litium
  ARTIFACT_TYPE: dotnet                    # nextjs, nodejs or nuxtjs for a storefront
  PROJECT: Src/<web-project>/<web-project>.csproj
  TARGET_FRAMEWORK: net8.0                 # match the web project
  PUBLISH_PATH: ${{ github.workspace }}/publish
  POLL_SECONDS: 15                         # time between two status checks
  ARTIFACT_TIMEOUT_MINUTES: 30             # nextjs, nodejs and nuxtjs artifacts are built after upload
  DEPLOY_TIMEOUT_MINUTES: 30

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Build and publish -------------------------------------------------------------
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x            # the CLI needs .NET 8; list your app's SDK too if it differs

      - name: Add the Litium NuGet feed
        env:
          NUGET_USER: ${{ secrets.LITIUM_NUGET_USER }}
          NUGET_PASSWORD: ${{ secrets.LITIUM_NUGET_PASSWORD }}
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.litium.com/nuget/ --name Litium \
            --username "$NUGET_USER" --password "$NUGET_PASSWORD" --store-password-in-clear-text

      # Add the client builds of your solution here, for example actions/setup-node
      # followed by npm or yarn steps, before the publish step.

      - name: Publish for Linux
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT" --configuration Release --framework "$TARGET_FRAMEWORK" \
            --os linux --arch x64 --output "$PUBLISH_PATH"
          # Litium.Cloud.Tools.Targets writes the manifest that the dotnet artifact type requires.
          if [ ! -f "$PUBLISH_PATH/litiumcloud.manifest.json" ]; then
            echo "litiumcloud.manifest.json is missing from $PUBLISH_PATH."
            echo "Add the Litium.Cloud.Tools.Targets package to the web project."
            exit 1
          fi

      # 2. Install the Litium Cloud CLI ----------------------------------------------------
      - name: Install the Litium Cloud CLI
        run: |
          set -euo pipefail
          dotnet tool update --global litium.cloud.cli --no-cache
          # Make the tool available to this step and to every step after it.
          export PATH="$HOME/.dotnet/tools:$PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          litium-cloud --version

      # 3. Sign in with the service principal ---------------------------------------------
      - name: Sign in with the service principal
        env:
          SERVICE_PRINCIPAL_ID: ${{ secrets.LITIUM_SP_ID }}
          CERTIFICATE: ${{ secrets.LITIUM_SP_CERTIFICATE }}
        run: |
          set -euo pipefail
          # Write the certificate to a file only the runner user can read. The CLI stores
          # the path and reads the file again on every later command, so keep it absolute.
          certificate_path="$RUNNER_TEMP/litium-cloud.pem"
          printf '%s\n' "$CERTIFICATE" > "$certificate_path"
          chmod 600 "$certificate_path"
          litium-cloud auth login --service-principal \
            --username "$SERVICE_PRINCIPAL_ID" --certificate "$certificate_path"

      # 4. Create the artifact -------------------------------------------------------------
      - name: Create the artifact
        id: artifact
        env:
          ARTIFACT_NAME: ${{ github.ref_name }}-${{ github.run_number }}
        run: |
          set -euo pipefail
          output=$(litium-cloud artifact create --subscription "$LITIUM_SUBSCRIPTION" \
            --artifact-type "$ARTIFACT_TYPE" --file-path "$PUBLISH_PATH" \
            --name "$ARTIFACT_NAME" --no-progress -o json)
          artifact_id=$(jq -r '.data.artifactId // empty' <<< "$output")
          if [ -z "$artifact_id" ]; then
            echo "$output"
            echo "Could not read data.artifactId from the artifact create output."
            exit 1
          fi
          echo "Artifact id: $artifact_id"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      # 5. Wait until the artifact is ready -----------------------------------------------
      - name: Wait for the artifact
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + ARTIFACT_TIMEOUT_MINUTES * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            artifact=$(litium-cloud artifact show --artifact "$ARTIFACT_ID" -o json) \
              || { echo "artifact show failed, retrying in $POLL_SECONDS seconds."; sleep "$POLL_SECONDS"; continue; }
            status=$(jq -r '.status' <<< "$artifact")
            echo "Artifact status: $status"
            case "$status" in
              Ready)
                exit 0 ;;
              Failed)
                # The build log is on the failed job; fall back to the artifact id, which
                # doubles as the id of the job that processed the artifact.
                failed_job=$(jq -r '.failedJobId // empty' <<< "$artifact")
                echo "The artifact failed to build. Build log:"
                litium-cloud status logs --job "${failed_job:-$ARTIFACT_ID}" || true
                exit 1 ;;
            esac
            sleep "$POLL_SECONDS"
          done
          echo "Timed out after $ARTIFACT_TIMEOUT_MINUTES minutes waiting for the artifact to become Ready."
          exit 1

      # 6. Deploy the artifact -------------------------------------------------------------
      - name: Deploy the artifact
        id: deploy
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          output=$(litium-cloud app deploy --subscription "$LITIUM_SUBSCRIPTION" \
            --environment "$LITIUM_ENVIRONMENT" --app "$LITIUM_APP" --artifact "$ARTIFACT_ID" -o json)
          job_id=$(jq -r '.jobId // empty' <<< "$output")
          if [ -z "$job_id" ]; then
            echo "$output"
            echo "Could not read jobId from the app deploy output."
            exit 1
          fi
          echo "Deployment job id: $job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      # 7. Wait for the deployment job ----------------------------------------------------
      - name: Wait for the deployment job
        env:
          JOB_ID: ${{ steps.deploy.outputs.job_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + DEPLOY_TIMEOUT_MINUTES * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            job=$(litium-cloud status show --job "$JOB_ID" -o json) \
              || { echo "status show failed, retrying in $POLL_SECONDS seconds."; sleep "$POLL_SECONDS"; continue; }
            # A job is completed when completedAt is set, but a completed job can still
            # contain a failed item at any depth. Look for failed items first.
            failed_jobs=$(jq -r '[.. | objects | select(.failed == true) | .jobId] | unique[]' <<< "$job")
            if [ -n "$failed_jobs" ]; then
              echo "The deployment failed. Failed items:"
              jq -r '.. | objects | select(.failed == true)
                     | "  \(.jobId)  \(.action // "-")  \(.documentId // "-")  \(.message // "")"' <<< "$job"
              for id in $failed_jobs; do
                echo "--- Log of job $id"
                litium-cloud status logs --job "$id" || true
              done
              exit 1
            fi
            if [ -n "$(jq -r '.completedAt // empty' <<< "$job")" ]; then
              echo "Deployment completed."
              exit 0
            fi
            echo "Deployment in progress."
            sleep "$POLL_SECONDS"
          done
          echo "Timed out after $DEPLOY_TIMEOUT_MINUTES minutes waiting for job $JOB_ID."
          exit 1
