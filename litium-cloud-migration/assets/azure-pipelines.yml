# Litium Serverless Cloud deployment pipeline (Azure DevOps)
#
# Adapt and test in your own repository before you point it at production.
# Replace every <placeholder>, adapt the project path, the target framework and the client build steps
# to your solution, and run it against a test environment first.
#
# Prerequisites
#   - A service principal with these roles (see the automated-deployments docs):
#       subscription/reader, artifact/creator, environment/reader (environment), appresource/writer (app)
#   - Its certificate uploaded as a secure file named cert.pem under Pipelines > Library > Secure files
#   - A variable group (below) with the Litium NuGet credentials and the service principal id
#
# Variable group 'litium-cloud-deploy':
#   LitiumNuGetUser      (secret)  Litium docs account user name, used for the NuGet feed
#   LitiumNuGetPassword  (secret)  its password
#   servicePrincipal     (secret)  the service principal id, service.<name>@cloud

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: litium-cloud-deploy
  - name: subscription
    value: <subscription-id>
  - name: environment
    value: <environment-id>
  - name: app
    value: <app-id>                       # for example: litium
  - name: artifactType
    value: dotnet                         # nextjs for a Litium Storefront app
  - name: publishPath
    value: $(Build.SourcesDirectory)/builds/publish/<web-project-name>

steps:
  - task: UseDotNet@2
    displayName: Use .NET 8 SDK
    inputs:
      packageType: sdk
      version: 8.0.x

  - script: >
      dotnet nuget add source https://nuget.litium.com/nuget/
      -n Litium -u "$(LitiumNuGetUser)" -p "$(LitiumNuGetPassword)"
      --store-password-in-clear-text
    displayName: Add Litium NuGet feed

  # Client builds from the legacy pipeline go here, unchanged. For the MVC Accelerator, typically:
  #   - pwsh: |
  #       yarn install
  #       yarn run prod
  #     workingDirectory: Src/<client-project>

  - task: DotNetCoreCLI@2
    displayName: Publish for Linux
    inputs:
      command: publish
      projects: <path-to-web-project>.csproj
      arguments: -c Release -o builds/publish -f <target-framework> -a x64 --os linux
      workingDirectory: $(Build.SourcesDirectory)
      zipAfterPublish: false

  # If license.json is not in the repository, download it as a secure file and copy it into the
  # publish folder here, before the artifact is created. It must be inside the artifact.

  - task: DotNetCoreCLI@2
    displayName: Install the Cloud CLI
    inputs:
      command: custom
      custom: tool
      arguments: update -g litium.cloud.cli --no-cache

  - task: DownloadSecureFile@1
    name: cert
    displayName: Download the service principal certificate
    inputs:
      secureFile: cert.pem

  - pwsh: |
      $ErrorActionPreference = "Stop"

      # 1. Sign in with the service principal. Use the absolute path the task reports.
      litium-cloud auth login --service-principal --certificate "$(cert.secureFilePath)" --username "$(servicePrincipal)"
      if ($LASTEXITCODE -ne 0) { exit 1 }

      # 2. Create the artifact.
      Write-Host "litium-cloud artifact create --subscription $(subscription) --artifact-type $(artifactType) --file-path $(publishPath) --no-progress -o json"
      $createOutput = litium-cloud artifact create --subscription "$(subscription)" --artifact-type "$(artifactType)" --file-path "$(publishPath)" --no-progress -o json
      if ($LASTEXITCODE -ne 0) { Write-Host $createOutput; exit 1 }
      $artifactId = ($createOutput | ConvertFrom-Json).data.artifactId
      Write-Host "artifactId: $artifactId"

      # 3. Wait until the artifact is Ready. dotnet and nextjs artifacts are built after upload,
      #    so several minutes in Processing is normal. Raise $maxRetries, not the sleep interval.
      $maxRetries = 500
      for ($i = 0; $i -lt $maxRetries; $i++) {
          $artifact = litium-cloud artifact show --artifact $artifactId -o json | ConvertFrom-Json
          if ($artifact.status -eq "Ready") { break }
          if ($artifact.status -eq "Failed") {
              Write-Host "Artifact build failed."
              litium-cloud status logs --job $artifactId     # the artifact id is its build job id
              exit 1
          }
          Start-Sleep -Seconds 5
      }
      if ($artifact.status -ne "Ready") { Write-Host "Timed out waiting for the artifact."; exit 1 }

      # 4. Deploy.
      Write-Host "litium-cloud app deploy --subscription $(subscription) --environment $(environment) --app $(app) --artifact $artifactId -o json"
      $deployOutput = litium-cloud app deploy --subscription "$(subscription)" --environment "$(environment)" --app "$(app)" --artifact $artifactId -o json
      if ($LASTEXITCODE -ne 0) { Write-Host $deployOutput; exit 1 }
      $jobId = ($deployOutput | ConvertFrom-Json).jobId
      Write-Host "jobId: $jobId"

      # 5. Wait for the deployment job. A parent job can report completed while a child item failed,
      #    so check items[].failed as well as completedAt.
      for ($i = 0; $i -lt $maxRetries; $i++) {
          $status = litium-cloud status show --job $jobId -o json | ConvertFrom-Json
          $failed = @($status.items | Where-Object { $_.failed }).Count -gt 0
          if ($failed) {
              Write-Host "Deploy failed."
              litium-cloud status logs --job $jobId
              exit 1
          }
          if ($status.completedAt) { Write-Host "Deploy finished."; exit 0 }
          Start-Sleep -Seconds 5
      }
      Write-Host "Timed out waiting for the deployment job."
      exit 1
    displayName: Sign in, create artifact and deploy
